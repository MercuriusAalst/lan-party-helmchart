nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# Public hostnames. Nothing in this chart serves them - your Cloudflare Tunnel
# routes them to the two ClusterIP services. They are here because the apps need
# to know their own public URLs (Auth0 callbacks, browser-facing image URLs).
hosts:
  frontend: PLACEHOLDER_FRONTEND_HOST
  backend: PLACEHOLDER_BACKEND_HOST

externalSecrets:
  secretStore:
    name: "" # required
    kind: ClusterSecretStore
  refreshInterval: 1h
  # envVar becomes both the Secret data key and the container env var name.
  # key is the secret's name in the store. With Infisical, a key containing '/'
  # is read as a folder path and must then start with '/'.
  backend:
    - envVar: Mercurius.LAN.API_Auth0__ManagementClientId
      key: AUTH0_MANAGEMENT_CLIENT_ID
    - envVar: Mercurius.LAN.API_Auth0__ManagementClientSecret
      key: AUTH0_MANAGEMENT_CLIENT_SECRET
    - envVar: Mercurius.LAN.API_Auth0__PasswordResetClientId
      key: AUTH0_PASSWORD_RESET_CLIENT_ID
  # Only needed when postgres.backup.enabled. Despite the field name, envVar is
  # just the Secret data key here - nothing mounts these as environment
  # variables; the ObjectStore reads the Secret directly.
  postgres: []
  frontend:
    - envVar: Auth0__ClientId
      key: AUTH0_WEB_CLIENT_ID
    - envVar: Auth0__ClientSecret
      key: AUTH0_WEB_CLIENT_SECRET
    - envVar: ContactEmail__Username
      key: SMTP_USERNAME
    - envVar: ContactEmail__Password
      key: SMTP_PASSWORD

postgres:
  enabled: true
  # Barman Cloud, through the CloudNativePG plugin installed by the gitops
  # repo's core/barman-cloud Application. Off by default: it needs a bucket and
  # credentials that only an environment can supply.
  backup:
    enabled: false
    # s3://bucket/path, or the equivalent for your provider.
    destinationPath: ""
    # Leave empty for AWS S3; set it for R2, MinIO, Backblaze and friends.
    endpointURL: ""
    # Defaults to the Secret rendered from externalSecrets.postgres below.
    credentialsSecret: ""
    accessKeyIdKey: ACCESS_KEY_ID
    secretAccessKeyKey: ACCESS_SECRET_KEY
    # The folder inside the bucket. Defaults to <release>-db. Keep it stable
    # across a cluster rebuild or the old history becomes unreachable.
    serverName: ""
    retentionPolicy: 30d
    wal:
      compression: gzip
    data:
      compression: gzip
  instances: 1
  database: mercurius
  owner: mercurius
  storage:
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

backend:
  image:
    repository: ghcr.io/mercuriusaalst/mercurius-backend
    tag: "0.5.2"
    pullPolicy: IfNotPresent
  # Empty: use the CloudNativePG cluster this chart creates. Set it to an
  # existing Secret carrying host/port/dbname/username/password to point the
  # backend at a database outside this release (postgres.enabled: false).
  database:
    existingSecret: ""
  # Uploaded media, served back through Imageflow at /images.
  # RWO: see the single-replica note in the README before raising this.
  storage:
    size: 5Gi
    storageClass: ""
    mountPath: /data/images
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1654
    fsGroup: 1654
  # Every key below also exists in the image's appsettings.json, which Program.cs
  # re-adds AFTER the default env provider. Only the prefixed provider wins, so
  # these must keep the Mercurius.LAN.API_ prefix. See README.
  config:
    Mercurius.LAN.API_Auth0__Audience: PLACEHOLDER_AUDIENCE
    Mercurius.LAN.API_Auth0__Authority: https://auth.mercurius-aalst.be/
    Mercurius.LAN.API_Auth0__RoleClaimType: https://mercurius-aalst.be/roles
    Mercurius.LAN.API_Auth0__ManagementAudience: https://mercurius-aalst.eu.auth0.com/api/v2/
    Mercurius.LAN.API_Auth0__DatabaseConnection: Username-Password-Authentication
    Mercurius.LAN.API_FileStorage__MaxFileSizeInMB: "5"
  nodeSelector: {}
  tolerations: []
  affinity: {}

frontend:
  image:
    repository: ghcr.io/mercuriusaalst/mercurius-frontend
    tag: "0.4.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  # The frontend image has no USER instruction, so it runs as root. Add
  # `USER $APP_UID` to its Dockerfile, then uncomment:
  # podSecurityContext:
  #   runAsNonRoot: true
  #   runAsUser: 1654
  podSecurityContext: {}
  config:
    Auth0__Domain: auth.mercurius-aalst.be
    Auth0__Audience: PLACEHOLDER_AUDIENCE
    Auth0__Scope: openid profile email
    Auth0__RoleClaimType: https://mercurius-aalst.be/roles
    Auth0__UseRefreshTokens: "false"
    ContactEmail__Enabled: "true"
    ContactEmail__Host: mail.mercurius-aalst.be
    ContactEmail__Port: "587"
    ContactEmail__EnableSsl: "true"
    ContactEmail__SenderEmail: lan+contact@mercurius-aalst.be
    ContactEmail__SenderName: Mercurius LAN website
    ContactEmail__RecipientEmail: lan@mercurius-aalst.be
  nodeSelector: {}
  tolerations: []
  affinity: {}
