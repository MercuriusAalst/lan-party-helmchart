{{- $fullName := include "lan-party.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-frontend
  labels:
    {{- include "lan-party.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "lan-party.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-frontend
  labels:
    {{- include "lan-party.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  # One replica: Blazor Server holds a per-user circuit in memory, so a second
  # replica needs sticky sessions at the tunnel before it helps anyone.
  replicas: 1
  selector:
    matchLabels:
      {{- include "lan-party.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "lan-party.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ required "frontend.image.tag is required" .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Program.cs calls UseHttpsRedirection. The tunnel terminates TLS and
            # forwards plain HTTP, so without this the app redirects to itself
            # forever. Honours X-Forwarded-Proto instead.
            - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
              value: "true"
            - name: MercuriusAPI__BaseAddress
              value: "https://{{ .Values.hosts.backend }}/"
            {{- range $k, $v := .Values.frontend.config }}
            - name: {{ $k | quote }}
              value: {{ $v | quote }}
            {{- end }}
            # Explicit entries rather than envFrom, matching the backend: see
            # the comment there for why envFrom cannot carry these names.
            {{- range .Values.externalSecrets.frontend }}
            - name: {{ .envVar | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-frontend
                  key: {{ .envVar | quote }}
            {{- end }}
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- with .Values.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
