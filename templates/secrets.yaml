{{- $store := .Values.externalSecrets.secretStore }}
{{- range $component := list "backend" "frontend" }}
{{- $items := index $.Values.externalSecrets $component }}
{{- if $items }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "lan-party.fullname" $ }}-{{ $component }}
  labels:
    {{- include "lan-party.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStore.name is required" $store.name }}
    kind: {{ $store.kind }}
  target:
    name: {{ include "lan-party.fullname" $ }}-{{ $component }}
    creationPolicy: Owner
  data:
    {{- range $items }}
    - secretKey: {{ .envVar | quote }}
      remoteRef:
        key: {{ .key | quote }}
        {{- with .property }}
        property: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
