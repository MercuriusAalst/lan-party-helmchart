# Same as lint-values, with backups on, so CI renders the ObjectStore and the
# Cluster's plugin block too. Without this the whole backup path would only
# ever be exercised in production.
externalSecrets:
  secretStore:
    name: lint
  postgres:
    - envVar: ACCESS_KEY_ID
      key: lint/s3
      property: access_key_id
    - envVar: ACCESS_SECRET_KEY
      key: lint/s3
      property: secret_access_key

postgres:
  backup:
    enabled: true
    destinationPath: s3://lint-bucket/backups
    endpointURL: https://lint.r2.cloudflarestorage.com
